<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Arimo:wght@700&family=Montserrat:wght@800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#111}
.s{width:1080px;height:1350px;position:relative;overflow:hidden;font-family:'Arimo',Arial,sans-serif;color:#fff;background:#1a1a1a}
.s img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ph{position:absolute;inset:0;background:radial-gradient(circle at 50% 35%,#4a4a4f,#151517 70%);display:flex;align-items:flex-start;justify-content:center;padding-top:300px}
.ph div{border:3px dashed rgba(255,255,255,.35);padding:30px 40px;font-size:30px;color:rgba(255,255,255,.7);text-align:center;max-width:760px;line-height:1.4}
.shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.28) 0%,rgba(0,0,0,0) 12%,rgba(0,0,0,0) 38%,rgba(0,0,0,.45) 58%,rgba(0,0,0,.82) 100%)}
.n{position:absolute;top:38px;right:56px;font-size:32px;text-shadow:0 2px 8px rgba(0,0,0,.4)}
.txt{position:absolute;left:68px;right:60px;bottom:163px}
.kick{display:inline-flex;align-items:center;gap:14px;background:#7DE304;color:#000;font-size:30px;letter-spacing:.06em;padding:10px 20px 10px 16px;margin-bottom:22px;text-shadow:none}
.kick span{width:16px;height:16px;border-radius:50%;background:#000;box-shadow:0 0 0 5px rgba(0,0,0,.25)}
h1{font-size:76px;line-height:1;margin-bottom:30px;letter-spacing:-.005em}
.l{color:#7DE304;font-size:34px;line-height:1.05;margin-top:21px}
.b{font-size:30px;line-height:1.2;margin-top:2px}
.end{font-size:30px;margin-top:28px}
.logo{position:absolute;left:60px;bottom:66px;display:flex;align-items:center;gap:18px;font-family:'Montserrat',sans-serif;font-weight:800;font-size:35px;letter-spacing:.01em}
.txt,.logo{text-shadow:0 2px 10px rgba(0,0,0,.35)}
</style></head><body><div id="root"></div>
<script>
const D=__DATA__, HAVE=__HAVE__;
document.getElementById('root').innerHTML=D.map((d,i)=>`
<section class="s" id="s${i+1}">
 ${HAVE[i]?`<img src="photos/${d.photo}">`:`<div class="ph"><div>PHOTO ${String(i+1).padStart(2,'0')}<br>${d.shot}<br><small>→ photos/${d.photo}</small></div></div>`}
 <div class="shade"></div>
 <div class="n">${String(i+1).padStart(2,'0')}</div>
 <div class="txt">${d.kicker?`<div class="kick"><span></span>${d.kicker}</div>`:""}<h1>${d.title}</h1>
  ${d.rows.map(r=>`<div class="l">${r[0]}</div><div class="b">${r[1]}</div>`).join('')}
  <div class="end">${d.end}</div></div>
 <div class="logo"><svg width="58" height="40" viewBox="0 0 58 40"><path fill="#7DE304" d="M0 6l14 12L29 0l15 18L58 6l-5 34H5z"/></svg>OOTDKi EDIT</div>
</section>`).join('');
</script></body></html>
